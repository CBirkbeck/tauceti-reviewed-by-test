name: Follow Tau Ceti

# Every 20 minutes: pins the commit Tau Ceti's published API docs show, its `docgen` branch, where
# Voyager's window also ends, or the newest before it the extractor can read (scripts/pin.py). When
# that moves, which is when new docs go live (a few times a day), it extracts the dataset, records what
# Voyager announced against it, rebuilds the site, and deletes the datasets nobody needs any more
# (scripts/prune.py); otherwise it stops there, in a minute. Voyager also starts it by hand when the
# site is behind `docgen` at the time of a post. Reviews keep
# the meaning hashes they were made on: a declaration whose meaning changed shows them greyed until
# reviewed again.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # the dataset's check opens an issue when it stops a dataset
  pages: write
  id-token: write

concurrency:
  group: follow-tauceti
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.pin.outputs.moved }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pin
        run: |
          python3 scripts/pin.py | tee -a "$GITHUB_OUTPUT"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha=$(python3 -c "import json; print(json.load(open('data/settings.json'))['tauceti'][:7])")
          git commit -q -am "Follow Tau Ceti to $sha"
          for attempt in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((attempt * 5)); done
  dataset:
    needs: pin
    if: needs.pin.outputs.moved == 'true'
    uses: ./.github/workflows/dataset.yml
    permissions:
      contents: write
      issues: write  # dataset.yml asks for it; without it GitHub refuses to start the run
  named:
    needs: [pin, dataset]
    if: "!cancelled() && needs.pin.outputs.moved == 'true' && needs.dataset.result == 'success'"
    uses: ./.github/workflows/voyager.yml
    with:
      site: false
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
  prune:
    needs: [pin, dataset]
    if: "!cancelled() && needs.dataset.result == 'success'"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/prune.py
  site:
    needs: [pin, dataset, named]
    if: "!cancelled() && needs.pin.result == 'success' && (needs.dataset.result == 'success' || needs.dataset.result == 'skipped') && (needs.pin.outputs.moved == 'true' || needs.named.outputs.recorded == 'true')"
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
