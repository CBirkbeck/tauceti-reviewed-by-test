# Generated by evidence-store (`evidence-store init`), and since 2026-10-28 run through our copy of its
# intake action (.github/actions/intake).
# Turns issues opened with the evidence forms, and the comments on them, into S3 records in the
# store, and says so on the issue. An event's run, or one by hand, reads its own issue and the evidence
# issues still open, so it also takes those whose runs a burst dropped; a sweep every six hours, of the
# last 14 days, catches what else a dropped run missed.
name: Evidence intake

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: evidence-intake
  cancel-in-progress: false

jobs:
  intake:
    # Not the bot's own closes and labels: a close by hand is a status, the bot's follows one. (Comments by
    # bots are read: an agent can act through a bot account.)
    if: ${{ !github.event.issue.pull_request && !(github.event_name == 'issues' && github.event.sender.type == 'Bot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/intake
        with:
          store: evidence
          sweep: ${{ github.event_name == 'schedule' && '--sweep-days 14' || '--sweep-open' }}
          pages-workflow: 'pages.yml'
          ref: v0.7.2
