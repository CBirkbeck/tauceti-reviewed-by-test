name: Dataset

# Extracts the dataset (S2) of one Tau Ceti commit with the newest extractor release of the series in
# data/settings.json, and publishes it as the release dataset-<commit12> of this repository: what the
# site, intake and the Voyager reader key records in.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The Tau Ceti commit (default the pinned one)
        required: false
      replace:
        description: Extract it again and replace the published dataset
        type: boolean
        default: false
  workflow_call:
    inputs:
      commit:
        type: string
        required: false

permissions:
  contents: write
  issues: write  # the issue that says why a dataset was not published

concurrency:
  group: dataset-${{ inputs.commit || 'pinned' }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Which commit
        run: |
          commit="${{ inputs.commit }}"
          [ -n "$commit" ] || commit=$(python3 -c "import json; print(json.load(open('data/settings.json'))['tauceti'])")
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "TAG=dataset-${commit:0:12}" >> "$GITHUB_ENV"
      - name: Already published?
        id: published
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "done=false" >> "$GITHUB_OUTPUT"; echo "EXISTS=false" >> "$GITHUB_ENV"
          elif [ "${{ format('{0}', inputs.replace) }}" = "true" ]; then
            echo "$TAG is published: extracting it again to replace it"
            echo "done=false" >> "$GITHUB_OUTPUT"; echo "EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "$TAG is already published"; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Room on the runner
        if: steps.published.outputs.done != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Tau Ceti at the commit
        if: steps.published.outputs.done != 'true'
        run: |
          git clone -q --filter=blob:none https://github.com/TauCetiProject/TauCeti "$RUNNER_TEMP/TauCeti"
          git -C "$RUNNER_TEMP/TauCeti" checkout -q "$COMMIT"
          cat "$RUNNER_TEMP/TauCeti/lean-toolchain"
      - name: Lean
        if: steps.published.outputs.done != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: uv, which Tau Ceti's lake-cache-get.sh runs
        if: steps.published.outputs.done != 'true'
        uses: astral-sh/setup-uv@v6
      - name: Tau Ceti and Mathlib from their caches
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          lake exe cache get
          bash scripts/lake-cache-get.sh .
          if ! lake build --no-build > /dev/null 2>&1; then
            echo "::notice::Not every module is in the cache; building the rest"
            lake build 2>&1 | tail -5 || true
          fi
          { lake build --no-build 2>&1 || true; } | sed -n '/logged failures/,$s/^- //p' > "$RUNNER_TEMP/unbuilt.txt"
          if [ -s "$RUNNER_TEMP/unbuilt.txt" ]; then
            echo "::warning::$(wc -l < "$RUNNER_TEMP/unbuilt.txt") modules do not build at $COMMIT and are left out"
          fi
      - name: The extractor, of the pinned series
        if: steps.published.outputs.done != 'true'
        run: |
          tag=$(python3 scripts/extractor.py install "$RUNNER_TEMP/TauCeti/lean-toolchain" "$RUNNER_TEMP/extractor")
          bin=$(find "$RUNNER_TEMP/extractor" -type f -name trust-extract | head -1)
          [ -x "$bin" ] || { echo "::error::no trust-extract in release $tag"; exit 1; }
          echo "EXTRACTOR_TAG=$tag" >> "$GITHUB_ENV"
          echo "EXTRACTOR_BIN=$bin" >> "$GITHUB_ENV"
      - name: Extract
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          sudo sysctl -q -w vm.max_map_count=262144 || true
          lake env "$EXTRACTOR_BIN" extract --root TauCeti --repo TauCetiProject/TauCeti --out "$RUNNER_TEMP/dataset" \
            --parts 8 --jobs 1 --skip-modules-file "$RUNNER_TEMP/unbuilt.txt" \
            --no-statements --no-upstream-docs
          attributes=$(find "$RUNNER_TEMP/extractor" -type f -name attributes.py | head -1)
          if [ -n "$attributes" ]; then python3 "$attributes" --dataset "$RUNNER_TEMP/dataset" --source .; fi
          du -sh "$RUNNER_TEMP/dataset"
      # What the site shows of a statement is what the docs show (2026-10-26): a docs page is printed with
      # its module's imports alone, this dataset with the whole library loaded, whose notation can differ.
      # Each header is taken from the docs' pages, as the facet docs-signature; a declaration they do not
      # have keeps the extractor's signature. Too many pages that do not come, and nothing is published.
      - name: The statements as the docs show them
        if: steps.published.outputs.done != 'true'
        run: python3 scripts/docs_signatures.py --dataset "$RUNNER_TEMP/dataset" --source "$RUNNER_TEMP/TauCeti"
      # The safeguard set up on 2026-10-25, after a dataset printed existentials without their binders'
      # types: a dataset whose signatures differ from the docs (or print a binder without its type) is not
      # published, an issue says which, and the site stays on the last dataset that passed. A statement
      # taken from the docs is compared with its page too, which catches a misreading.
      - name: The signatures say what the docs say
        if: steps.published.outputs.done != 'true'
        run: |
          if python3 scripts/check_signatures.py --dataset "$RUNNER_TEMP/dataset" --source "$RUNNER_TEMP/TauCeti" \
              --report "$RUNNER_TEMP/signatures.md"; then
            exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "Dataset ${COMMIT:0:12}: its signatures differ from the docs" \
            --body-file "$RUNNER_TEMP/signatures.md" || true
          echo "::error::the dataset's signatures differ from the docs: not published"
          exit 1
      - name: Publish
        if: steps.published.outputs.done != 'true'
        run: |
          tar -czf "$RUNNER_TEMP/dataset.tar.gz" -C "$RUNNER_TEMP/dataset" .
          repo=$(python3 -c "import json; print(json.load(open('data/settings.json'))['extractor']['repo'])")
          checked=$(head -2 "$RUNNER_TEMP/signatures.md" | tr '\n' ' ')
          notes="The dataset (S2) of TauCetiProject/TauCeti at $COMMIT, by trust-extract $EXTRACTOR_TAG ($repo). $checked"
          if [ "$EXISTS" = "true" ]; then
            gh release upload "$TAG" "$RUNNER_TEMP/dataset.tar.gz" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" "$RUNNER_TEMP/dataset.tar.gz" -R "$GITHUB_REPOSITORY" --latest=false \
              --title "Dataset for Tau Ceti $COMMIT" --notes "$notes"
          fi
