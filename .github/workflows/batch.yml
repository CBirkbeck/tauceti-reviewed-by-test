name: Batch marks into the code

# Collects the marks recorded since the last batch into one pull request, the
# way the kernel's `b4 trailers -u` collects Reviewed-by replies. Weekly, on
# Monday mornings, and by hand whenever wanted. The pull request waits for a
# human: nothing here writes to Tau Ceti.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/declarations
      - name: Collect the new marks
        id: batch
        run: echo "count=$(python3 scripts/batch.py --message "$RUNNER_TEMP/message.txt")" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.batch.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="batch/$(date -u +%Y-%m-%d-%H%M)"
          git switch -c "$branch"
          git add snapshot
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git push -q origin "$branch"
          gh pr create --head "$branch" --title "$(head -n 1 "$RUNNER_TEMP/message.txt")" --body-file "$RUNNER_TEMP/message.txt"
