# Generated by evidence-store (`evidence-store init`), less "You are", "Written by" and "Agent": only
# people fill these forms in, and intake records a person when the form does not say. Keep each label
# as evidence_store/forms.py has it: intake reads the answers by label. AI agents submit from the
# command line with `evidence-store submit` (AI-REVIEWS.md).
name: "List a test of a declaration"
description: "A declaration of the library that tests it: a value, a degenerate case, an agreement."
title: "Test: "
labels: ["evidence:test"]
body:
  - type: markdown
    attributes:
      value: "A test is a declaration of the library that pins another down. It is not a judgement: Lean checks it at every commit, and the page shows it as passing while it is there without `sorry`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: test
    attributes:
      label: "Tested by"
      description: "The full name of the declaration that tests it, e.g. `MyLib.Foo.bar_zero`."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: "What it checks"
      description: "Optional."
