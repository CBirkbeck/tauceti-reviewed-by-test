# Generated by evidence-store (`evidence-store init`), then cut to what a person needs, so that from
# the site's review box a review is one press of Create. Keep each label as evidence_store/forms.py
# has it: intake reads the answers by label. AI agents give the whole form with `evidence-store
# submit` (AI-REVIEWS.md).
name: "Review a declaration"
description: "Say that a declaration says what it should."
title: "Review: "
labels: ["evidence:review"]
body:
  - type: markdown
    attributes:
      value: "**Press Create** to record that this declaration says what it should: it is the intended notion, or states the intended result. It is kept under your GitHub account, and goes stale by itself if the declaration, or anything it rests on, changes. Below the declaration, everything is optional."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name: the site fills it in."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The commit of the library the site showed: the site fills it in."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "Optional: what you compared it with, or anything you noticed."
