# Generated by evidence-store (`evidence-store init`), less "You are", "Written by" and "Agent": only
# people fill these forms in, and intake records a person when the form does not say. Keep each label
# as evidence_store/forms.py has it: intake reads the answers by label. AI agents submit from the
# command line with `evidence-store submit` (AI-REVIEWS.md).
name: "Review a declaration"
description: "Say that a declaration means what it should, and what you checked."
title: "Review: "
labels: ["evidence:review"]
body:
  - type: markdown
    attributes:
      value: "A review is a judgement about **meaning**: does this declaration say what it is supposed to say? It is recorded in the repository's evidence store under your GitHub account, and goes stale by itself if the declaration, or anything it rests on, changes."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: reference
    attributes:
      label: "Compared with"
      description: "What you compared it with: a book or paper and section, a URL, or \"my own knowledge\"."
  - type: checkboxes
    id: checked
    attributes:
      label: "What you checked"
      description: "Tick what you checked. What is left unticked is shown as not checked."
      options:
        - label: "object: it is the intended notion, or states the intended result, and not a different one"
        - label: "convention: it follows the source's conventions: normalization, indexing, signs, and the instances it picks up"
        - label: "edge-cases: it decides degenerate and boundary inputs as the source does"
        - label: "junk: no default value outside the intended domain changes what it means"
        - label: "vacuous: it is neither vacuous nor trivial"
        - label: "choice: it makes no arbitrary choice where the intended object is canonical"
        - label: "generality: it is as general as the source"
        - label: "naming: its name and docstring do not mislead"
  - type: textarea
    id: caveats
    attributes:
      label: "Caveats"
      description: "One per line, starting with what it is about: `edge-cases: false at n = 0`."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "Optional."
