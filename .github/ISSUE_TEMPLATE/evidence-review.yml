# Generated by evidence-store (`evidence-store init`), cut down to the one question the site asks: is the
# declaration correctly stated? This form is the yes, evidence-problem.yml the no. Neither asks who
# wrote it: only people fill these forms in, and intake records a person. Keep each label as
# evidence_store/forms.py has it: intake reads the answers by label. AI agents answer from the command
# line with `evidence-store submit` (AI-REVIEWS.md).
name: "Yes: it is correctly stated"
description: "Answer yes: the declaration says what it should."
title: "Correctly stated: "
labels: ["evidence:review"]
body:
  - type: markdown
    attributes:
      value: "**Is it correctly stated? Yes:** it says what it should, the intended notion or the intended result. The site has filled in the declaration and the commit: submit, and your answer is recorded under your GitHub account. It goes stale by itself if the declaration, or anything it rests on, changes."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Filled in by the site."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "Filled in by the site: the library's commit you read it at."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "Optional."
