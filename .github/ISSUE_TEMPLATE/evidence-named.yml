# Generated by evidence-store (`evidence-store init`), less "You are", "Written by" and "Agent": only
# people fill these forms in, and intake records a person when the form does not say. Keep each label
# as evidence_store/forms.py has it: intake reads the answers by label. AI agents submit from the
# command line with `evidence-store submit` (AI-REVIEWS.md).
name: "Name a result or notable definition"
description: "Point readers at what matters: a named theorem, a notable definition."
title: "Named: "
labels: ["evidence:named"]
body:
  - type: markdown
    attributes:
      value: "Most of a library is API and steps of proofs. A name marks a declaration out as one to read first."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: input
    id: name
    attributes:
      label: "Name"
      description: "What mathematicians call it: \"Dirichlet's unit theorem\"."
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: "It is"
      options:
        - "a named result"
        - "a notable definition"
  - type: textarea
    id: about
    attributes:
      label: "In one sentence"
  - type: input
    id: source
    attributes:
      label: "Named where"
      description: "Optional: a paper, a roadmap, a URL."
