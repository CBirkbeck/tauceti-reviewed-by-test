# Generated by evidence-store (`evidence-store init`), then cut to what a person needs, so that from
# the site's review box a review is one press of Create. Keep each label as evidence_store/forms.py
# has it: intake reads the answers by label. AI agents give the whole form with `evidence-store
# submit` (AI-REVIEWS.md).
name: "Ask a question about a declaration"
description: "What is it at 0? Why this convention?"
title: "Question: "
labels: ["evidence:question"]
body:
  - type: markdown
    attributes:
      value: "Ask, and **press Create**. Answers are comments on this issue; you or a maintainer close it with `/answered`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name: the site fills it in."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The commit of the library the site showed: the site fills it in."
  - type: textarea
    id: question
    attributes:
      label: "Question"
    validations:
      required: true
