# Generated by evidence-store (`evidence-store init`), less "You are", "Written by" and "Agent": only
# people fill these forms in, and intake records a person when the form does not say. Keep each label
# as evidence_store/forms.py has it: intake reads the answers by label. AI agents submit from the
# command line with `evidence-store submit` (AI-REVIEWS.md).
name: "Ask a question about a declaration"
description: "What is it at 0? Why this convention?"
title: "Question: "
labels: ["evidence:question"]
body:
  - type: markdown
    attributes:
      value: "Answers are comments on this issue. The asker or a maintainer closes it with `/answered`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: textarea
    id: question
    attributes:
      label: "Question"
    validations:
      required: true
