# Generated by evidence-store (`evidence-store init`) as its question form, made the site's "What could
# be better" box: a suggestion for a declaration that is correct but could be done better. It is
# recorded as a question, open until it is dealt with, and counts as neither a yes nor a no. It does not
# ask who wrote it: only people fill these forms in, and intake records a person. Keep each label as
# evidence_store/forms.py has it: intake reads the answers by label, hence "Question" for the
# suggestion.
name: "What could be better"
description: "It is correct, but could be done better: say how."
title: "What could be better: "
labels: ["evidence:question"]
body:
  - type: markdown
    attributes:
      value: "**What could be better?** For a declaration that is correctly stated but could be done better: more general, a better name or docstring, a cleaner statement, a lemma it should come with. The site has filled in the declaration and the commit. Your suggestion is recorded under your GitHub account; replies are comments here, and you or a maintainer close it when it is dealt with."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Filled in by the site."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "Filled in by the site: the library's commit you read it at."
  - type: textarea
    id: question
    attributes:
      label: "Question"
      description: "Your suggestion: what could be better, and how."
    validations:
      required: true
