# Generated by evidence-store (`evidence-store init`), less "You are", "Written by" and "Agent": only
# people fill these forms in, and intake records a person when the form does not say. Keep each label
# as evidence_store/forms.py has it: intake reads the answers by label. AI agents submit from the
# command line with `evidence-store submit` (AI-REVIEWS.md).
name: "Report a problem with a declaration"
description: "It does not mean what it should."
title: "Problem: "
labels: ["evidence:problem"]
body:
  - type: markdown
    attributes:
      value: "A problem stays open until its reporter or a maintainer comments `/fixed <commit>`, `/intended` or `/invalid`. Comments on this issue are recorded as replies."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name, e.g. `MyLib.Foo.bar`."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The library's commit you read it at. Empty: the latest."
  - type: dropdown
    id: category
    attributes:
      label: "What is wrong"
      options:
        - "a different object"
        - "a different convention"
        - "different edge cases"
        - "a junk value"
        - "vacuous or trivial"
        - "an arbitrary choice"
        - "less general than the source"
        - "a misleading name or docstring"
        - "something else"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "The counterexample, the case, or the step that fails."
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: "Suggested fix"
      description: "Optional: what it should be, in Lean or in words."
