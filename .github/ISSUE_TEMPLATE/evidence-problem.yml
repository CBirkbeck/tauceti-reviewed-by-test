# Generated by evidence-store (`evidence-store init`), cut down to the one question the site asks: is the
# declaration correctly stated? This form is the no, evidence-review.yml the yes. Neither asks who
# wrote it: only people fill these forms in, and intake records a person. Keep each label as
# evidence_store/forms.py has it: intake reads the answers by label, and a no without "What is wrong"
# is recorded as "other". AI agents answer from the command line with `evidence-store submit`
# (AI-REVIEWS.md).
name: "No: it is not correctly stated"
description: "Answer no, and say why."
title: "Not correctly stated: "
labels: ["evidence:problem"]
body:
  - type: markdown
    attributes:
      value: "**Is it correctly stated? No.** Say why below. The site has filled in the declaration and the commit. Your answer is recorded under your GitHub account, and stays open until you or a maintainer comment `/fixed <commit>`, `/intended` or `/invalid`; comments here are recorded as replies."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Filled in by the site."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "Filled in by the site: the library's commit you read it at."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "What is wrong with how it is stated: a case it gets wrong, a counterexample, or what it should say."
    validations:
      required: true
