# Generated by evidence-store (`evidence-store init`), then cut to what a person needs, so that from
# the site's review box a review is one press of Create. Keep each label as evidence_store/forms.py
# has it: intake reads the answers by label. AI agents give the whole form with `evidence-store
# submit` (AI-REVIEWS.md).
name: "Report a problem with a declaration"
description: "It does not say what it should."
title: "Problem: "
labels: ["evidence:problem"]
body:
  - type: markdown
    attributes:
      value: "Say what is wrong and **press Create**. The problem stays open, and the declaration is flagged, until you or a maintainer comment `/fixed <commit>`, `/intended` or `/invalid`. Comments on this issue are recorded as replies."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name: the site fills it in."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The commit of the library the site showed: the site fills it in."
  - type: textarea
    id: rationale
    attributes:
      label: "Why"
      description: "What is wrong: the counterexample, the case, or the step that fails."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "What is wrong"
      description: "Optional."
      options:
        - "a different object"
        - "a different convention"
        - "different edge cases"
        - "a junk value"
        - "vacuous or trivial"
        - "an arbitrary choice"
        - "less general than the source"
        - "a misleading name or docstring"
        - "something else"
  - type: textarea
    id: fix
    attributes:
      label: "Suggested fix"
      description: "Optional: what it should be, in Lean or in words."
