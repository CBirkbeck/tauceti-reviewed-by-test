# Generated by evidence-store (`evidence-store init`), then cut to what a person needs, so that from
# the site's review box a review is one press of Create. Keep each label as evidence_store/forms.py
# has it: intake reads the answers by label. AI agents give the whole form with `evidence-store
# submit` (AI-REVIEWS.md).
name: "Propose a test of a declaration"
description: "A property it should have, for someone to prove in the library."
title: "Challenge: "
labels: ["evidence:challenge"]
body:
  - type: markdown
    attributes:
      value: "Say what it should satisfy if it says what it should (a value, an edge case, agreement with another notion) and **press Create**. It stays open until someone proves it in the library and comments `/met <the declaration that proves it>`."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Its full Lean name: the site fills it in."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "The commit of the library the site showed: the site fills it in."
  - type: textarea
    id: property
    attributes:
      label: "What it should satisfy"
      description: "In words, or in Lean: `vonMangoldt 1 = 0`, \"agrees with Mathlib's … on …\"."
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: "As a Lean statement"
      description: "Optional: the statement to prove, as you would write it after `theorem`."
