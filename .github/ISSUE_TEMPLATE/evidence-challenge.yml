# Generated by evidence-store (`evidence-store init`), cut down for the site's "Suggest a test" button,
# under Tests in the review box: a property the declaration should have, for someone to prove in the
# library. It is recorded as a challenge, open until a declaration proves it, and counts as neither a
# yes nor a no. It does not ask who wrote it: only people fill these forms in, and intake records a
# person. Keep each label as evidence_store/forms.py has it: intake reads the answers by label. AI
# agents submit from the command line with `evidence-store challenge` (AI-REVIEWS.md).
name: "Suggest a test"
description: "A property it should have, for someone to prove in the library."
title: "Suggested test: "
labels: ["evidence:challenge"]
body:
  - type: markdown
    attributes:
      value: "**Suggest a test:** something the declaration should satisfy if it says what it should, such as a value, an edge case or an agreement with another notion. The site has filled in the declaration and the commit. It stays open until someone proves it in the library and comments `/met <the declaration that proves it>`; the page then lists that declaration as a test, and checks at every commit that it still passes."
  - type: input
    id: decl
    attributes:
      label: "Declaration"
      description: "Filled in by the site."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Commit"
      description: "Filled in by the site: the library's commit you read it at."
  - type: textarea
    id: property
    attributes:
      label: "What it should satisfy"
      description: "In words, or in Lean: `vonMangoldt 1 = 0`, \"agrees with Mathlib's … on …\"."
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: "As a Lean statement"
      description: "Optional: the statement to prove, as you would write it after `theorem`."
  - type: textarea
    id: catches
    attributes:
      label: "What it would catch"
      description: "Optional: what a wrong definition would get wrong here."
